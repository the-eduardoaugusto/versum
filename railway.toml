[build]
buildCommand = "rm -rf node_modules apps/*/node_modules packages/*/node_modules && bun install --include=optional && (cd apps/api && bun -e \"import('sharp').then(s => console.log('sharp OK', s.default.versions.sharp)).catch(e => { console.error('sharp FAILED', e); process.exit(1); })\") && cd apps/api && bun build src/server.ts --outdir dist --target bun --external:sharp"

[deploy]
startCommand = "cd apps/api && bun run dist/server.js"
