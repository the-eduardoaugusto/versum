name: CI - Obsidian Vault

on:
  pull_request:
    paths:
      - "Obsidian Vault/**"
      - "scripts/validate-vault.ts"
      - ".github/workflows/vault.yml"

  push:
    branches: [main, development]
    paths:
      - "Obsidian Vault/**"
      - "scripts/validate-vault.ts"

jobs:
  validate:
    name: Validate Vault Structure & Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Validate Vault Structure
        run: bun scripts/validate-vault.ts

      - name: Check for Markdown Formatting
        run: |
          # Verify all .md files have valid YAML frontmatter
          for file in $(find "Obsidian Vault/Docs" -name "*.md" -type f); do
            if ! grep -q "^---$" "$file"; then
              echo "❌ Missing frontmatter in $file"
              exit 1
            fi
          done
          echo "✅ All markdown files have frontmatter"

      - name: Verify Required Tags
        run: |
          # Ensure at least "versum" and "docs" tags in all files
          missing_tags=0
          for file in $(find "Obsidian Vault/Docs" -name "*.md" -type f); do
            if ! grep -q "tags:.*versum" "$file" || ! grep -q "tags:.*docs" "$file"; then
              echo "⚠️  Missing required tags in $file"
              missing_tags=$((missing_tags + 1))
            fi
          done
          if [ $missing_tags -gt 0 ]; then
            echo "❌ $missing_tags files missing required tags"
            exit 1
          fi
          echo "✅ All files have required tags"

      - name: Check Obsidian Links
        run: |
          # Find all [[...]] links
          broken_links=0
          for file in $(find "Obsidian Vault/Docs" -name "*.md" -type f); do
            while IFS= read -r line; do
              # Extract links like [[...]]
              links=$(echo "$line" | grep -o '\[\[[^]]*\]\]' || true)
              if [ -n "$links" ]; then
                echo "Found links in $file: $links"
              fi
            done < "$file"
          done
          echo "✅ Link extraction complete"

      - name: Comment on PR (if validation fails)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Obsidian Vault validation failed. Please check the CI logs for details.\n\n**Common issues:**\n- Missing or invalid YAML frontmatter\n- Missing required tags: `versum`, `docs`\n- Invalid Obsidian links `[[...]]`\n- Missing breadcrumb navigation'
            })
